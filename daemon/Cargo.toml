[package]
name = "fili-term-daemon"
version = "2.0.0"
edition = "2024"
description = "Session daemon of fili-term: owns the ptys and the terminal state (alacritty_terminal), no Qt"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
libc = "0.2"
polling = "3"
