[package]
name = "fili-term-daemon"
version = "3.0.0"
edition = "2024"
description = "Session daemon of fili-term: owns the ptys and the terminal state (alacritty_terminal), no Qt"
license = "GPL-3.0-or-later"
publish = false

[features]
# Never enabled here: logs.rs (shared with the window) keeps its Qt part behind it
gui = []

[dependencies]
env_logger = { version = "0.11", default-features = false }
log = "0.4"
serde_json = "1"
alacritty_terminal = { version = "0.26", default-features = false }
libc = "0.2"
polling = "3"
