[package]
name = "fili-term"
version = "1.0.0"
edition = "2024"
description = "fili-term: the Filigrane terminal, a small session daemon (Rust, alacritty_terminal) and a Qt Quick window"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = [".", "daemon"]

[dependencies]
libc = "0.2"
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10.0"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
